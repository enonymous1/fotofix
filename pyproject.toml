[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fotofix"
version = "2.0.0"
description = "Bulk orientation fixing, sorting, optimizing, and stitching for batch-scanned photos"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "enonymous1" }]
dependencies = [
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
vision = [
    "onnxruntime>=1.16.0",
    "pytesseract>=0.3.10",
    "opencv-python>=4.8.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
fotofix = "fotofix.cli:main_entry"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
